<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" font-family="Vazirmatn, Tahoma, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <linearGradient id="hdrfa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1240" height="1000" fill="#f8fafc"/>
  <rect width="1240" height="78" fill="url(#hdrfa)"/>
  <text x="1210" y="34" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="end">معماری Sentinel — خط پردازش چهارمرحله‌ای PPE</text>
  <text x="1210" y="60" fill="#94a3b8" font-size="14" text-anchor="end">تشخیص انسان ← تشخیص تجهیزات ← تخصیص هندسی (مالکیت) ← حافظهٔ زمانی ← رخداد تخلف</text>

  <!-- INPUT (right, since RTL) -->
  <g>
    <rect x="1040" y="130" width="170" height="120" rx="12" fill="#64748b"/>
    <text x="1125" y="165" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">ورودی</text>
    <text x="1125" y="188" fill="#e2e8f0" font-size="12" text-anchor="middle">CCTV · RTSP</text>
    <text x="1125" y="206" fill="#e2e8f0" font-size="12" text-anchor="middle">ویدیو یا تصویر</text>
    <text x="1125" y="224" fill="#cbd5e1" font-size="11" text-anchor="middle">فریم به فریم</text>
  </g>
  <line x1="1040" y1="190" x2="988" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowfa)"/>

  <!-- STAGE A -->
  <g>
    <rect x="765" y="120" width="220" height="140" rx="12" fill="#2563eb"/>
    <text x="875" y="148" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">مرحله A — تشخیص انسان</text>
    <text x="875" y="170" fill="#dbeafe" font-size="12" text-anchor="middle">YOLO11n روی COCO</text>
    <text x="875" y="188" fill="#dbeafe" font-size="12" text-anchor="middle">فقط کلاس person</text>
    <text x="875" y="210" fill="#bfdbfe" font-size="11" text-anchor="middle">+ ByteTrack → شناسهٔ پایدار</text>
    <text x="875" y="228" fill="#bfdbfe" font-size="11" text-anchor="middle">بدون انسان ⇒ مدل PPE اجرا نمی‌شود</text>
    <text x="875" y="248" fill="#93c5fd" font-size="10" text-anchor="middle" font-style="italic">conf=0.20 · TensorRT FP16</text>
  </g>
  <line x1="765" y1="190" x2="713" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowfa)"/>
  <text x="739" y="178" fill="#475569" font-size="10" text-anchor="middle">کادر + شناسهٔ افراد</text>

  <!-- STAGE B -->
  <g>
    <rect x="460" y="120" width="250" height="140" rx="12" fill="#1d4ed8"/>
    <text x="585" y="148" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">مرحله B — تشخیص تجهیزات (PPE)</text>
    <rect x="475" y="160" width="220" height="38" rx="7" fill="#3b82f6"/>
    <text x="585" y="177" fill="#eff6ff" font-size="11" text-anchor="middle">B1 · عبور تمام‌فریم — YOLOv8n (Snehil)</text>
    <text x="585" y="191" fill="#dbeafe" font-size="10" text-anchor="middle">۴ کلاس: کلاه/بی‌کلاه · جلیقه/بی‌جلیقه</text>
    <rect x="475" y="204" width="220" height="46" rx="7" fill="#60a5fa"/>
    <text x="585" y="221" fill="#0f172a" font-size="11" text-anchor="middle">B2 · برش و بزرگ‌نمایی (۳۲۰px)</text>
    <text x="585" y="236" fill="#1e293b" font-size="10" text-anchor="middle">افراد کوچک · حداکثر ۴ نفر · هر ۵ فریم یک‌بار</text>
  </g>
  <line x1="460" y1="190" x2="408" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowfa)"/>
  <text x="434" y="178" fill="#475569" font-size="10" text-anchor="middle">کادر PPE</text>

  <!-- STAGE C -->
  <g>
    <rect x="205" y="120" width="200" height="140" rx="12" fill="#7c3aed"/>
    <text x="305" y="148" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">مرحله C — تخصیص هندسی</text>
    <text x="305" y="170" fill="#ede9fe" font-size="11" text-anchor="middle">قواعد مالکیت هندسی</text>
    <text x="305" y="188" fill="#ddd6fe" font-size="11" text-anchor="middle">کلاه ⇒ نوار سر [-.20H,+.40H]</text>
    <text x="305" y="204" fill="#ddd6fe" font-size="11" text-anchor="middle">جلیقه ⇒ نوار تنه [.10H,.85H]</text>
    <text x="305" y="222" fill="#c4b5fd" font-size="10" text-anchor="middle">IoA≥40% · اندازه · بهترین صاحب</text>
    <text x="305" y="238" fill="#c4b5fd" font-size="10" text-anchor="middle">PPE بی‌صاحب ⇒ حذف</text>
  </g>
  <line x1="205" y1="190" x2="153" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowfa)"/>
  <text x="179" y="178" fill="#475569" font-size="10" text-anchor="middle">شاهد</text>

  <!-- STAGE D -->
  <g>
    <rect x="30" y="120" width="120" height="140" rx="12" fill="#0d9488"/>
    <text x="90" y="150" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">مرحله D</text>
    <text x="90" y="170" fill="#ccfbf1" font-size="11" text-anchor="middle">حافظهٔ</text>
    <text x="90" y="186" fill="#ccfbf1" font-size="11" text-anchor="middle">زمانی</text>
    <text x="90" y="208" fill="#99f6e4" font-size="10" text-anchor="middle">امتیاز هر شناسه</text>
    <text x="90" y="222" fill="#99f6e4" font-size="10" text-anchor="middle">هیسترزیس</text>
    <text x="90" y="236" fill="#99f6e4" font-size="10" text-anchor="middle">ضدچشمک‌زنی</text>
  </g>

  <line x1="90" y1="260" x2="90" y2="318" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowfa)"/>

  <!-- COMPLIANCE / EVENT LOG -->
  <g>
    <rect x="30" y="320" width="375" height="130" rx="12" fill="#16a34a"/>
    <text x="217" y="352" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">موتور تخلف + ثبت رخداد</text>
    <text x="217" y="378" fill="#dcfce7" font-size="12" text-anchor="middle">تخلف تأییدشده فقط بعد از ≥۸ فریم پیوسته</text>
    <text x="217" y="399" fill="#dcfce7" font-size="12" text-anchor="middle">جدول رخداد: شناسه · نوع PPE · شروع · پایان · مدت</text>
    <text x="217" y="422" fill="#bbf7d0" font-size="11" text-anchor="middle" font-style="italic">برنامه‌ریزی‌شده: منطقهٔ خطر · هشدار تلگرام · گزارش CSV</text>
  </g>
  <line x1="405" y1="385" x2="457" y2="385" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowfa)"/>

  <!-- OUTPUT HUD -->
  <g>
    <rect x="460" y="320" width="340" height="130" rx="12" fill="#0f172a"/>
    <text x="630" y="352" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">خروجی حاشیه‌نویسی‌شده (HUD)</text>
    <text x="630" y="378" fill="#e2e8f0" font-size="12" text-anchor="middle">کادر گوشه‌دار · برچسب کپسولی · نوار وضعیت · FPS</text>
    <text x="630" y="399" fill="#e2e8f0" font-size="12" text-anchor="middle">تصویر برش‌خوردهٔ هر رخداد تخلف</text>
    <text x="630" y="422" fill="#94a3b8" font-size="11" text-anchor="middle" font-style="italic">ویدیوی H.264 · تصویر JPG · جدول DataFrame</text>
  </g>

  <!-- POSE (dashed) -->
  <g>
    <rect x="835" y="320" width="150" height="130" rx="12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="910" y="352" fill="#475569" font-size="13" font-weight="700" text-anchor="middle">مدل ژست</text>
    <text x="910" y="374" fill="#64748b" font-size="11" text-anchor="middle">YOLO11n-pose</text>
    <text x="910" y="392" fill="#64748b" font-size="11" text-anchor="middle">فقط نمایشی</text>
    <text x="910" y="412" fill="#94a3b8" font-size="10" text-anchor="middle" font-style="italic">صفر اثر در تصمیم‌گیری</text>
  </g>
  <line x1="835" y1="385" x2="803" y2="385" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowfa)"/>

  <!-- GATES DETAIL PANEL -->
  <g>
    <rect x="30" y="480" width="1180" height="150" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1185" y="512" fill="#0f172a" font-size="15" font-weight="700" text-anchor="end">گیت‌های تصمیم در مرحلهٔ C (مطابق کد Config)</text>
    <text x="1185" y="540" fill="#334155" font-size="12" text-anchor="end">Gate ۱ — IoA ≥ ۰.۴۰ داخل کادر بزرگ‌شدهٔ شخص (x_margin=۰.۱۵، top_margin=۰.۲۰)</text>
    <text x="1185" y="564" fill="#334155" font-size="12" text-anchor="end">Gate ۲ — کلاه در نوار سر [-۰.۲۰H, +۰.۴۰H]، جلیقه در نوار تنه [۰.۱۰H, ۰.۸۵H]</text>
    <text x="1185" y="588" fill="#334155" font-size="12" text-anchor="end">Gate ۳ — اندازهٔ منطقی: کلاه حداکثر ۱.۳×عرض شخص، ارتفاعش نسبت به «ارتفاع مرجع» (max(h, 2w)) محدود می‌شود</text>
    <text x="1185" y="612" fill="#64748b" font-size="11" font-style="italic" text-anchor="end">قاعدهٔ «غیرقابل‌قضاوت»: سر خارج از فریم ⇒ بدون حکم بی‌کلاه · نمای نزدیک بدون تنه ⇒ بدون حکم بی‌جلیقه</text>
  </g>

  <!-- TEMPORAL DETAIL PANEL -->
  <g>
    <rect x="30" y="650" width="1180" height="120" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1185" y="682" fill="#0f172a" font-size="15" font-weight="700" text-anchor="end">فرمول حافظهٔ زمانی (مرحلهٔ D)</text>
    <text x="1185" y="710" fill="#334155" font-size="13" text-anchor="end" font-family="Consolas, monospace" direction="ltr">s ← 0.85·s ± evidence   (s ∈ [-3, 3])</text>
    <text x="1185" y="736" fill="#334155" font-size="12" text-anchor="end">«دارد» در s ≥ +۱.۰  ·  «ندارد» فقط در s ≤ −۱.۵ و با حداقل ۵ ارزیابی (عمداً سخت‌گیرتر از تأیید مثبت)</text>
    <text x="1185" y="758" fill="#64748b" font-size="11" font-style="italic" text-anchor="end">۴۵ فریم بدون شاهد جدید ⇒ وضعیت «نامعلوم» · کادر آخر تا ۱۰ فریم روی صفحه نگه داشته می‌شود</text>
  </g>

  <!-- LEGEND -->
  <g>
    <rect x="30" y="790" width="1180" height="175" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1185" y="822" fill="#0f172a" font-size="15" font-weight="700" text-anchor="end">راهنمای رنگ بلوک‌ها</text>

    <rect x="1160" y="840" width="26" height="16" rx="4" fill="#64748b"/>
    <text x="1150" y="853" fill="#0f172a" font-size="12" text-anchor="end">ورودی</text>
    <rect x="900" y="840" width="26" height="16" rx="4" fill="#2563eb"/>
    <text x="890" y="853" fill="#0f172a" font-size="12" text-anchor="end">تشخیص عصبی (A / B)</text>

    <rect x="1160" y="872" width="26" height="16" rx="4" fill="#7c3aed"/>
    <text x="1150" y="885" fill="#0f172a" font-size="12" text-anchor="end">استدلال هندسی (C)</text>
    <rect x="900" y="872" width="26" height="16" rx="4" fill="#0d9488"/>
    <text x="890" y="885" fill="#0f172a" font-size="12" text-anchor="end">حافظهٔ زمانی (D)</text>

    <rect x="1160" y="904" width="26" height="16" rx="4" fill="#16a34a"/>
    <text x="1150" y="917" fill="#0f172a" font-size="12" text-anchor="end">تطبیق و رخداد</text>
    <rect x="900" y="904" width="26" height="16" rx="4" fill="#0f172a"/>
    <text x="890" y="917" fill="#0f172a" font-size="12" text-anchor="end">خروجی نمایشی</text>

    <rect x="1160" y="936" width="26" height="16" rx="4" fill="none" stroke="#94a3b8" stroke-dasharray="5 3"/>
    <text x="1150" y="949" fill="#0f172a" font-size="12" text-anchor="end">فقط نمایشی (بدون اثر در تصمیم)</text>

    <line x1="55" y1="828" x2="860" y2="828" stroke="#e2e8f0" stroke-width="2"/>
    <text x="840" y="855" fill="#475569" font-size="12" font-weight="600" text-anchor="end">قاعدهٔ طلایی این معماری:</text>
    <text x="840" y="878" fill="#475569" font-size="12" text-anchor="end">هر تصمیم PPE باید ریشه در یک انسان تأییدشده داشته باشد —</text>
    <text x="840" y="898" fill="#475569" font-size="12" text-anchor="end">کلاه بی‌صاحب هرگز آلارم نمی‌سازد.</text>
    <text x="840" y="930" fill="#94a3b8" font-size="11" font-style="italic" text-anchor="end">منبع: ppe_monitor.py (v4.3) و docs/ARCHITECTURE.md</text>
  </g>

  <text x="1210" y="985" fill="#94a3b8" font-size="12" text-anchor="end">PPE_detection-Sentinel · نسخهٔ تفصیلی فارسیِ نمودار معماری با مقادیر دقیق تنظیمات</text>
</svg>
